substitutions:
  _TAG: 'latest'

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nubra-live:$_TAG'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nubra-live:$_TAG'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nubra-live'
      - '--image=gcr.io/$PROJECT_ID/nubra-live:$_TAG'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      # SINGLETON: this is a stateful WebSocket ingestion service. Running >1
      # instance causes split-brain (duplicate subscriptions + each instance
      # running its own 3-min snapshot scheduler with a separately-loaded
      # instrument master). Instances still loading the master have empty
      # ref_maps and write empty/zero order-book snapshots. Pin to exactly 1.
      - '--max-instances=1'
      - '--min-instances=1'
      # Background asyncio loop (WS consumer, pipeline, snapshot scheduler)
      # must keep running between HTTP requests. With CPU throttling on,
      # the event loop stalls when idle and drops ticks / misses flushes.
      - '--no-cpu-throttling'
      # Singleton ingestion: one in-flight request slot. Prevents Cloud Run
      # from using request concurrency as a signal to spin up siblings.
      - '--concurrency=1'
      - '--set-env-vars=NUBRA_ENV=PROD,NUBRA_EXCHANGE=NSE,ENABLE_NUBRA_SOCKET=true,USE_DATABASE=true,USE_REDIS=false,LOG_LEVEL=WARNING,ENVIRONMENT=production,STRIKE_RADIUS=15,CANDLE_INTERVAL_MINUTES=3,MARKET_TIMEZONE=Asia/Kolkata,SUBSCRIBE_SDK_OPTION_CHAIN=true,INITIAL_NIFTY_PRICE=24500.0,DB_SCHEMA=trading_data,POSTGRES_DSN=postgresql://postgres:Welcome6720@/tradingdb?host=/cloudsql/stock-anaysis:asia-south1:tradingmigration'
      - '--add-cloudsql-instances=stock-anaysis:asia-south1:tradingmigration'
      - '--update-secrets=NUBRA_AUTH_TOKEN=nubra-auth-token:latest,NUBRA_X_DEVICE_ID=nubra-x-device-id:latest,NUBRA_SESSION_TOKEN=nubra-session-token:latest,PHONE_NO=PHONE_NO:latest,MPIN=MPIN:latest,NUBRA_TOTP_SECRET=NUBRA_TOTP_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/nubra-live:$_TAG'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
